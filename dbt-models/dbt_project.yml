name: 'itp_data_platform'
version: '1.0.0'
config-version: 2

profile: 'itp_data_platform'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  itp_data_platform:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      finance:
        +materialized: table
        +partition_by:
          field: month_year
          data_type: date
      operations:
        +materialized: table
      executive:
        +materialized: table

vars:
  # Date range for incremental models
  start_date: '2023-01-01'
  end_date: '2025-12-31'