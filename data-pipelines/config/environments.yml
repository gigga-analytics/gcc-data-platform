development:
  project_id: "itp-data-platform-dev"
  region: "europe-west1"
  datasets:
    raw: "dev_raw"
    staging: "dev_staging"
    warehouse: "dev_warehouse"
    analytics: "dev_analytics"
  storage:
    data_lake_bucket: "itp-data-platform-dev-data-lake"
    temp_bucket: "itp-data-platform-dev-temp"
  pubsub:
    financial_topic: "dev-financial-stream"
    monitoring_topic: "dev-monitoring"
  logging:
    level: "DEBUG"
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  monitoring:
    enabled: true
    alert_thresholds:
      data_freshness_hours: 24
      pipeline_success_rate: 0.95
      cost_per_day_eur: 200

